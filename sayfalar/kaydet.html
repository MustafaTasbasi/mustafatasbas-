<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#BizeHerYerTrabzon-Yorum Kaydet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom right, #00264d, #800020);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        #aa {
            font-size: 24px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        a {
            margin-top: 30px;
            text-decoration: none;
            color: #fff;
            background-color: #0059b3;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #0077e6;
        }
    </style>
</head>

<body>
    <div id="aa"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const aa = params.get('fname') + " " + params.get('lname') + " - Yorumunuz alınmıştır: " + params.get('yorum');
        var mesaj = document.getElementById("aa");
        mesaj.innerHTML = aa;
    </script>
    <a href="../index.html">Ana sayfaya geri dön</a>
</body>

</html>
