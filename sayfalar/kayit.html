    <h2>Yorum Sayfası</h2>

            <div class="card-header">
                <h3>Yorum Kaydetme Formu</h3>
            </div>
            <div class="card-body">
                <form action="kaydet.html" name="kayit" id="kayit" method="GET" onsubmit="return kontrol();">
                    <label for="fname">Adınız:</label>

                    <label for="tparola">Parola(tekrar):</label>
                    <input type="password" id="tparola" name="tparola" value="">

                    <label for="yorum">Yorumunuz:</label>
                    <input type="text" id="yorum" name="yorum" value="">

                    <input type="submit" value="Gönder" class="btn-primary">
                </form>
