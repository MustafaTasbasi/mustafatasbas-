<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#BizeHerYerTrabzon-Yorum Kayıt</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom right, #004080, #7a001f);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 40px;
        }

        a {
            color: #ffffff;
            text-decoration: none;
            background-color: #0059b3;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #0077e6;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 28px;
            text-shadow: 1px 1px 5px #000;
        }

        form {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 500px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            margin-top: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #00b4d8;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #0077b6;
        }

        #hata {
            margin-top: 20px;
            color: #ff9999;
            font-weight: bold;
            text-align: center;
        }
    </style>
    <script>
        function kontrol() {
            var h = document.getElementById("hata");
            var hata = "";
            var bayrak = true;

            var fname = document.getElementById("fname").value;
            if (fname == "") {
                bayrak = false;
                hata = "Adınızı boş geçemezsiniz";
            }

            var lname = document.getElementById("lname").value;
            if (lname == "") {
                bayrak = false;
                hata = "Soyadınızı boş geçemezsiniz";
            }

            var user = document.getElementById("user").value;
            if (user == "") {
                bayrak = false;
                hata = "Kullanıcı adınızı boş geçemezsiniz";
            }

            var parola = document.getElementById("parola").value;
            if (parola == "") {
                bayrak = false;
                hata = "Şifreyi boş geçemezsiniz";
            }

            var tparola = document.getElementById("tparola").value;
            if (tparola == "") {
                bayrak = false;
                hata = "Yenilenen şifreyi boş geçemezsiniz";
            }

            var yorum = document.getElementById("yorum").value;
            if (yorum == "") {
                bayrak = false;
                hata = "Yorumu boş geçemezsiniz";
            }

            if (parola != tparola) {
                bayrak = false;
                hata = "Parolalar uyumlu değil";
            }

            h.innerHTML = hata;
            return bayrak;
        }
    </script>
</head>

<body>
    <a href="../index.html">Ana sayfaya geri dön</a>
    <h2>Yorum Sayfası</h2>

    <form action="kaydet.html" name="kayit" id="kayit">
        <label for="fname">Adınız:</label>
        <input type="text" id="fname" name="fname" value="">

        <label for="lname">Soyadınız:</label>
        <input type="text" id="lname" name="lname" value="">

        <label for="user">Kullanıcı Adı:</label>
        <input type="text" id="user" name="user" value="">

        <label for="parola">Parola:</label>
        <input type="password" id="parola" name="parola" value="">

        <label for="tparola">Parola(tekrar):</label>
        <input type="password" id="tparola" name="tparola" value="">

        <label for="yorum">Yorumunuz:</label>
        <input type="text" id="yorum" name="yorum" value="">

        <input type="submit" value="Gönder" onclick="return kontrol();">
    </form>

    <div id="hata"></div>
</body>

</html>
